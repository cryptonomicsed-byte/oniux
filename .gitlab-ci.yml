image: rust:latest

stages:
  - check
  - build

rust-clippy:
  stage: check
  allow_failure: true
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

cargo-fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --check

rust-latest:
  stage: build
  script:
    - cargo build --all-features --all-targets

rust-msrv:
  stage: build
  image: docker.io/amd64/rust:1.92
  script:
    - cargo build --all-features --all-targets
