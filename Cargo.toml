[package]
name = "oniux"
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Isolate Applications over Tor using Linux Namespaces"
repository = "https://gitlab.torproject.org/tpo/core/oniux"
keywords = ["tor", "arti", "privacy", "anonymity"]
categories = ["command-line-utilities", "cryptography"]
rust-version = "1.92"

[dependencies]
anyhow = "1.0.104"
caps = "0.5.6"
clap = { version = "4.6.7", features = ["derive"] }
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-sys = "0.9.0"
nix = { version = "0.31.3", features = ["sched", "process", "fs", "mount", "user"] }
onion-tunnel = { git = "https://gitlab.torproject.org/tpo/core/onionmasq.git" }
arti = { version = "2.7.0" , features = ["experimental-api"]}
sendfd = "0.4.5"
smoltcp = { version = "0.14.0" }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["full"] }
thiserror = "2.0.21"
rustls = "0.23.46"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
opt-level = "s"
