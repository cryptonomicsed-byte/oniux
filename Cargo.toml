[package]
name = "oniux"
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Isolate Applications over Tor using Linux Namespaces"
repository = "https://gitlab.torproject.org/tpo/core/oniux"
keywords = ["tor", "arti", "privacy", "anonymity"]
categories = ["command-line-utilities", "cryptography"]
rust-version = "1.91"

[dependencies]
anyhow = "1.0.102"
caps = "0.5.6"
clap = { version = "4.6.1", features = ["derive"] }
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.30.0"
netlink-sys = "0.8.8"
nix = { version = "0.31.3", features = ["sched", "process", "fs", "mount", "user"] }
onion-tunnel = { git = "https://gitlab.torproject.org/tpo/core/onionmasq.git" }
arti = { version = "2.3.0" , features = ["experimental-api"]}
sendfd = "0.4.4"
smoltcp = { version = "0.13.1" }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
thiserror = "2.0.18"
rustls = "0.23.40"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = true
opt-level = "s"
