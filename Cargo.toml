[package]
name = "oniux"
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Isolate Applications over Tor using Linux Namespaces"
repository = "https://gitlab.torproject.org/tpo/core/oniux"
keywords = ["tor", "arti", "privacy", "anonymity"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0.101"
caps = "0.5.6"
clap = { version = "4.5.57", features = ["derive"] }
netlink-packet-core = "0.8.1"
netlink-packet-route = "0.28.0"
netlink-sys = "0.8.8"
nix = { version = "0.31.1", features = ["sched", "process", "fs", "mount", "user"] }
onion-tunnel = { git = "https://gitlab.torproject.org/tpo/core/onionmasq.git" }
arti = { version = "2.0.0" , features = ["experimental-api"]}
sendfd = "0.4.4"
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp.git", rev = "08c7be0f067debcfef564f98066659c24752c439" }
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["full"] }
thiserror = "2.0.18"
rustls = "0.23.36"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[profile.release]
lto = true
opt-level = "s"
