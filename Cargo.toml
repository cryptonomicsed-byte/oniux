[package]
name = "oniux"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Isolate Applications over Tor using Linux Namespaces"
repository = "https://gitlab.torproject.org/tpo/core/oniux"
keywords = ["tor", "arti", "privacy", "anonymity"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0.99"
caps = "0.5.5"
clap = { version = "4.5.47", features = ["derive"] }
netlink-packet-core = "0.8.0"
netlink-packet-route = "0.28.0"
netlink-sys = "0.8.7"
nix = { version = "0.31.0", features = ["sched", "process", "fs", "mount", "user"] }
onion-tunnel = { git = "https://gitlab.torproject.org/tpo/core/onionmasq.git" }
arti = { version = "2.0.0" , features = ["experimental-api"]}
sendfd = "0.4.4"
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp.git", rev = "39cd44e585aae109f37a2bc9f31376414968456d" }
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0.16"
rustls = "0.23.35"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[profile.release]
lto = true
opt-level = "s"
